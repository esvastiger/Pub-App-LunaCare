version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - '@angular/*'
      tooling:
        patterns:
          - prettier
          - typescript
          - tailwindcss
          - '@tailwindcss/*'
          - postcss
    commit-message:
      prefix: 'chore'
      include: scope

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
